<div class="booking-page">
  <div class="booking-intro">
    <p class="eyebrow">Booking Inquiry</p>
    <h1>Send a booking inquiry</h1>
    <p class="lead">
      Share your event details and we will confirm availability, package options, and next steps.
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="booking-form" novalidate>
    <label class="field field--full selected-package" *ngIf="hasSelectedPackage()">
      <span>Selected package</span>
      <input formControlName="selectedPackage" readonly />
    </label>

    <label class="field">
      <span>Full name <b>Required</b></span>
      <input formControlName="name" placeholder="Your full name" />
      <small class="field-error" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">
        Please enter your full name.
      </small>
    </label>

    <label class="field">
      <span>Email <b>Required</b></span>
      <input formControlName="email" type="email" placeholder="you@example.com" />
      <small class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Please enter a valid email address.
      </small>
    </label>

    <label class="field">
      <span>Mobile number <b>Required</b></span>
      <input formControlName="phone" type="tel" placeholder="09XXXXXXXXX" />
      <small class="field-error" *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">
        Please enter a valid mobile number.
      </small>
    </label>

    <label class="field">
      <span>Event date <b>Required</b></span>
      <input formControlName="date" type="date" />
      <small class="field-error" *ngIf="form.get('date')?.touched && form.get('date')?.invalid">
        Please choose an event date.
      </small>
    </label>

    <label class="field">
      <span>Preferred time</span>
      <input formControlName="time" type="time" />
    </label>

    <label class="field">
      <span>Number of guests <b>Required</b></span>
      <input formControlName="pax" type="number" min="1" />
      <small class="field-error" *ngIf="form.get('pax')?.touched && form.get('pax')?.invalid">
        Please enter at least 1 guest.
      </small>
    </label>

    <label class="field">
      <span>Occasion</span>
      <input formControlName="occasion" placeholder="Wedding, birthday, corporate event" />
    </label>

    <label class="field field--full">
      <span>Venue</span>
      <input formControlName="venue" placeholder="Venue address" />
    </label>

    <label class="field field--full">
      <span>Message / requirements <b>Required</b></span>
      <textarea
        formControlName="message"
        rows="7"
        placeholder="Tell us about your menu preferences, setup needs, timing, and other event details"
      ></textarea>
      <small class="field-note">Minimum length: 20 characters.</small>
      <small class="field-error" *ngIf="form.get('message')?.touched && form.get('message')?.invalid">
        Please write at least 20 characters.
      </small>
    </label>

    <label class="honeypot" aria-hidden="true">
      <span>Website</span>
      <input formControlName="website" tabindex="-1" autocomplete="off" />
    </label>

    <p class="status status--error field--full" *ngIf="errorMessage" role="alert">
      {{ errorMessage }}
    </p>

    <p class="status status--loading field--full" *ngIf="submitting" aria-live="polite">
      Sending your booking email. Please keep this page open.
    </p>

    <button type="submit" class="submit-button field--full" [disabled]="submitting">
      <span class="button-spinner" *ngIf="submitting" aria-hidden="true"></span>
      {{ submitting ? 'Sending booking...' : 'Send Booking Email' }}
    </button>
  </form>
</div>
